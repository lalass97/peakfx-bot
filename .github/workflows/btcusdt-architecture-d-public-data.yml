name: BTCUSDT Architecture D Public Data Baseline

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btcusdt-architecture-d-public-data.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusdt-architecture-d-range-mean-reversion
          fetch-depth: 1
      - name: Validate frozen spec and backtester
        run: |
          test -f docs/BTCUSDT_ARCH_D_FROZEN_BASELINE_SPEC.md
          test -f research/backtest_btcusdt_arch_d.py
          python -m py_compile research/backtest_btcusdt_arch_d.py
      - name: Run frozen BTCUSDT Architecture D baseline
        env:
          BTC_OUT: artifacts/btcusdt-arch-d-baseline
          BTC_CACHE: artifacts/btcusdt-arch-d-baseline/data
        run: python research/backtest_btcusdt_arch_d.py
      - name: Show summary
        run: cat artifacts/btcusdt-arch-d-baseline/summary.csv
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-architecture-d-public-data-${{ github.run_id }}
          path: |
            artifacts/btcusdt-arch-d-baseline/results.json
            artifacts/btcusdt-arch-d-baseline/summary.csv
            artifacts/btcusdt-arch-d-baseline/trades.csv
            artifacts/btcusdt-arch-d-baseline/equity_curve.csv
          if-no-files-found: error
          retention-days: 30
