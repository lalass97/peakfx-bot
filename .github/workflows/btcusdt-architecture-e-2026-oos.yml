name: BTCUSDT Architecture E 2026 OOS

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btcusdt-architecture-e-2026-oos.yml"

permissions:
  contents: read

jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusdt-architecture-e-2026-oos
          fetch-depth: 0
      - name: Validate frozen OOS protocol and runner
        run: |
          test "$(git rev-parse 1702a3b14f3f9df93715e18fb335d54d9b2eac7c)" = "1702a3b14f3f9df93715e18fb335d54d9b2eac7c"
          test "$(git rev-parse f974d17f9f69d3bd26f869612d4eb7cdaa4b2221)" = "f974d17f9f69d3bd26f869612d4eb7cdaa4b2221"
          test "$(git rev-parse 2d0e1f9387e159c1ad1002f387d6c5e04d90b0b1)" = "2d0e1f9387e159c1ad1002f387d6c5e04d90b0b1"
          test -f docs/BTCUSDT_ARCH_E_2026_OOS_FROZEN_PROTOCOL.md
          python -m py_compile research/backtest_btcusdt_arch_e_2026_oos.py
      - name: Run one-time 2026 OOS
        env:
          BTC_OUT: artifacts/btcusdt-arch-e-2026-oos
          BTC_CACHE: artifacts/btcusdt-arch-e-2026-oos/data
        run: python research/backtest_btcusdt_arch_e_2026_oos.py
      - name: Show OOS summary
        run: cat artifacts/btcusdt-arch-e-2026-oos/oos_summary.csv
      - name: Upload OOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-architecture-e-2026-oos-${{ github.run_id }}
          path: |
            artifacts/btcusdt-arch-e-2026-oos/oos_results.json
            artifacts/btcusdt-arch-e-2026-oos/oos_summary.csv
            artifacts/btcusdt-arch-e-2026-oos/oos_trades.csv
            artifacts/btcusdt-arch-e-2026-oos/oos_equity_curve.csv
            artifacts/btcusdt-arch-e-2026-oos/oos_data_hashes.csv
          if-no-files-found: error
          retention-days: 30
