name: BTCUSDT Architecture H Public Data

on:
  push:
    paths:
      - '.github/workflows/btcusdt-architecture-h-public-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusdt-architecture-h-eth-led-catchup
          fetch-depth: 0
      - name: Validate frozen sequencing and source
        run: |
          test "$(git rev-parse cbe150196227a8f536d700024ef9defc987a43d9)" = "cbe150196227a8f536d700024ef9defc987a43d9"
          test "$(git rev-parse e2cf387d035f4f08ad5062a90299b9b9d1e441bd)" = "e2cf387d035f4f08ad5062a90299b9b9d1e441bd"
          test "$(git rev-parse e2cf387d035f4f08ad5062a90299b9b9d1e441bd^)" = "cbe150196227a8f536d700024ef9defc987a43d9"
          test -f research/BTCUSDT_ARCHITECTURE_H_FROZEN_SPEC.md
          test -f research/backtest_btcusdt_arch_h.py
          python -m py_compile research/backtest_btcusdt_arch_h.py
      - name: Run frozen Architecture H baseline
        env:
          BTC_OUT: artifacts/btcusdt-arch-h-baseline
          BTC_CACHE: artifacts/btcusdt-arch-h-baseline/data
        run: python research/backtest_btcusdt_arch_h.py
      - name: Show summary
        run: cat artifacts/btcusdt-arch-h-baseline/summary.csv
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-architecture-h-public-data-${{ github.run_id }}
          path: |
            artifacts/btcusdt-arch-h-baseline/results.json
            artifacts/btcusdt-arch-h-baseline/summary.csv
            artifacts/btcusdt-arch-h-baseline/trades.csv
            artifacts/btcusdt-arch-h-baseline/equity_curve.csv
            artifacts/btcusdt-arch-h-baseline/data_hashes.csv
          if-no-files-found: error
          retention-days: 30
