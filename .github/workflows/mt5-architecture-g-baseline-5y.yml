name: MT5 Architecture G Baseline 5Y

on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        default: "research/architecture-g-mtf-trend-pullback"
      deposit:
        required: true
        default: "10000"
      leverage:
        required: true
        default: "100"
  push:
    paths:
      - ".github/workflows/mt5-architecture-g-baseline-5y.yml"

permissions:
  contents: read

env:
  MT5_ROOT: "C:\\Program Files\\MetaTrader 5"

jobs:
  baseline:
    name: Run frozen Architecture G baseline matrix
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 600
    steps:
      - name: Checkout exact Architecture G ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'research/architecture-g-mtf-trend-pullback' }}
          fetch-depth: 0
      - name: Enable PowerShell scripts
        shell: cmd
        run: reg.exe ADD "HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" /v ExecutionPolicy /t REG_SZ /d RemoteSigned /f
      - name: Validate frozen inputs
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @("$env:MT5_ROOT\terminal64.exe","$env:MT5_ROOT\metaeditor64.exe","$PWD\mt5\run_architecture_g_baseline_5y.ps1","$PWD\mt5\PeakFX_EURUSD_ARCH_G_MTF_TREND_PULLBACK.mq5","$PWD\docs\ARCHITECTURE_G_FROZEN_BASELINE_SPEC.md","$PWD\scripts\verify_architecture_g_artifact.py")){if(-not(Test-Path $p)){throw "Missing $p"}}
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\mt5\run_architecture_g_baseline_5y.ps1",[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Host $_.Message};throw 'Architecture G runner parser validation failed'}
          python -m py_compile "$PWD\scripts\verify_architecture_g_artifact.py"
          if($LASTEXITCODE-ne0){throw 'Verifier syntax validation failed'}
      - name: Run Architecture G frozen baseline matrix
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          & "$PWD\mt5\run_architecture_g_baseline_5y.ps1" `
            -MetaTraderRoot $env:MT5_ROOT `
            -RepoRoot $PWD `
            -Deposit ([double]"${{ github.event_name == 'workflow_dispatch' && inputs.deposit || '10000' }}") `
            -Leverage "1:${{ github.event_name == 'workflow_dispatch' && inputs.leverage || '100' }}"
      - name: Independently verify complete artifact
        shell: powershell
        run: |
          python "$PWD\scripts\verify_architecture_g_artifact.py" "$PWD\artifacts\architecture-g-baseline-5y" --output "$PWD\artifacts\architecture-g-baseline-5y\independent_verification.json"
          if($LASTEXITCODE-ne0){throw 'Independent Architecture G artifact verification failed'}
      - name: Upload Architecture G baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-architecture-g-baseline-5y-${{ github.run_id }}
          path: artifacts/architecture-g-baseline-5y/**
          if-no-files-found: error
          retention-days: 30
