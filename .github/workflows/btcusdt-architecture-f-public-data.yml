name: BTCUSDT Architecture F Public Data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btcusdt-architecture-f-public-data.yml"

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusdt-architecture-f-failed-breakdown-reversal
          fetch-depth: 0
      - name: Validate frozen sequencing and source
        run: |
          test "$(git rev-parse ffed6dd0bb8b122d1af817aa24f140d19c3d8ed7)" = "ffed6dd0bb8b122d1af817aa24f140d19c3d8ed7"
          test "$(git rev-parse 3c447835b23899c50dddb8b7cc2f464572b3caca)" = "3c447835b23899c50dddb8b7cc2f464572b3caca"
          test "$(git rev-parse 3c447835b23899c50dddb8b7cc2f464572b3caca^)" = "ffed6dd0bb8b122d1af817aa24f140d19c3d8ed7"
          test -f research/BTCUSDT_ARCHITECTURE_F_FROZEN_SPEC.md
          test -f research/backtest_btcusdt_arch_f.py
          python -m py_compile research/backtest_btcusdt_arch_f.py
      - name: Run frozen Architecture F baseline
        env:
          BTC_OUT: artifacts/btcusdt-arch-f-baseline
          BTC_CACHE: artifacts/btcusdt-arch-f-baseline/data
        run: python research/backtest_btcusdt_arch_f.py
      - name: Show summary
        run: cat artifacts/btcusdt-arch-f-baseline/summary.csv
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-architecture-f-public-data-${{ github.run_id }}
          path: |
            artifacts/btcusdt-arch-f-baseline/results.json
            artifacts/btcusdt-arch-f-baseline/summary.csv
            artifacts/btcusdt-arch-f-baseline/trades.csv
            artifacts/btcusdt-arch-f-baseline/equity_curve.csv
            artifacts/btcusdt-arch-f-baseline/data_hashes.csv
          if-no-files-found: error
          retention-days: 30
