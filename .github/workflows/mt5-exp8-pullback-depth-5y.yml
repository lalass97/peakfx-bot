name: MT5 EXP8 Pullback Depth 5Y

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact EXP8 branch or commit
        required: true
        default: "research/exp8-pullback-architecture"
      deposit:
        description: Test deposit
        required: true
        default: "10000"
      leverage:
        description: Leverage integer
        required: true
        default: "100"
  push:
    paths:
      - ".github/dispatch/exp8-pullback-depth.trigger"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MT5_ROOT: "C:\\Program Files\\MetaTrader 5"

jobs:
  exp8_window:
    name: EXP8 ${{ matrix.window }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 130
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        window: [2020_2021, 2021_2022, 2022_2023, 2023_2024, 2024_2025]
    steps:
      - name: Checkout exact EXP8 ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'research/exp8-pullback-architecture' }}
          fetch-depth: 0

      - name: Restore authoritative EXP2 builder
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $builder = "$PWD/research/build_confirmed_breakout_exp2_candidate.py"
          if (-not (Test-Path $builder)) {
            git show "origin/research/robustness-5y-exp2-exp3a-exp6a:research/build_confirmed_breakout_exp2_candidate.py" | Set-Content -LiteralPath $builder -Encoding UTF8
          }
          if (-not (Test-Path $builder)) { throw "EXP2 builder restore failed" }

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve authoritative EXP1 source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($path in @($env:MT5_ROOT,"$env:MT5_ROOT\terminal64.exe","$env:MT5_ROOT\metaeditor64.exe")) {
            if (-not (Test-Path $path)) { throw "Required path not found: $path" }
          }
          $candidates = Get-ChildItem "$env:APPDATA\MetaQuotes\Terminal" -Filter "*.mq5" -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $candidates += Get-ChildItem "$env:USERPROFILE\Downloads" -Filter "*.mq5" -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          $resolved = $null
          foreach ($candidate in ($candidates | Select-Object -Unique)) {
            $text = Get-Content -LiteralPath $candidate -Raw -ErrorAction SilentlyContinue
            if ($text -match '26073024' -and $text -match 'peakfx_confirmed_breakout_exp1_events\.csv' -and $text -match '0\.10\s*\*\s*atr' -and $text -match 'pullback_high' -and $text -match 'pullback_low') { $resolved = $candidate; break }
          }
          if (-not $resolved) { throw "Could not locate verified EXP1 source." }
          "EXP1_COMPILED_CLEAN_SOURCE=$resolved" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved EXP1: $resolved"

      - name: Run frozen EXP8 annual window
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $script = "$PWD/mt5/run_exp8_pullback_depth_window.ps1"
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message }; throw "EXP8 window runner parser validation failed" }
          & $script `
            -MetaTraderRoot $env:MT5_ROOT `
            -RepoRoot $PWD `
            -CompiledCleanExp1Source $env:EXP1_COMPILED_CLEAN_SOURCE `
            -WindowId "${{ matrix.window }}" `
            -Deposit ([double]"${{ github.event_name == 'workflow_dispatch' && inputs.deposit || '10000' }}") `
            -Leverage "1:${{ github.event_name == 'workflow_dispatch' && inputs.leverage || '100' }}" `
            -WindowTimeoutMinutes 100

      - name: Upload annual EXP8 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-exp8-${{ matrix.window }}-${{ github.run_id }}
          path: artifacts/mt5-exp8-pullback-depth-${{ matrix.window }}/**
          if-no-files-found: warn
          retention-days: 30
