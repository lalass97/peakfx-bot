name: MT5 EXP3B Run 1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact branch or commit to validate
        required: true
        default: "research/exp3b-er20-030-mt5-candidate"
      deposit:
        description: Test deposit
        required: true
        default: "10000"
      leverage:
        description: Leverage, e.g. 100
        required: true
        default: "100"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  run1:
    name: Compile, smoke, and fixed 12-month EXP3B screen
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Enable runner script execution
        shell: cmd
        run: |
          reg.exe ADD "HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" /v ExecutionPolicy /t REG_SZ /d RemoteSigned /f

      - name: Install Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify runner environment
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("MT5_ROOT","EXP1_COMPILED_CLEAN_SOURCE")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Runner must define $name" }
          }
          foreach ($path in @($env:MT5_ROOT,$env:EXP1_COMPILED_CLEAN_SOURCE,"$env:MT5_ROOT\terminal64.exe","$env:MT5_ROOT\metaeditor64.exe")) {
            if (-not (Test-Path $path)) { throw "Required path not found: $path" }
          }
          python --version

      - name: Prepare exact EXP3B one-variable calibration
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          $builderA = "$PWD/research/build_confirmed_breakout_exp3a_candidate.py"
          $builderB = "$PWD/research/build_confirmed_breakout_exp3b_candidate.py"
          $runnerA = "$PWD/mt5/run_exp3a_validation.ps1"
          $runnerB = "$PWD/mt5/run_exp3b_validation.ps1"

          foreach ($required in @($builderA,$runnerA)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "EXP3B preparation source missing: $required" }
          }

          Copy-Item -LiteralPath $builderA -Destination $builderB -Force
          Copy-Item -LiteralPath $runnerA -Destination $runnerB -Force

          $builderText = Get-Content $builderB -Raw
          if ($builderText -notmatch 'MinimumEfficiencyRatio\s*=\s*0\.35;') {
            throw "EXP3B builder preparation could not find the ER 0.35 threshold"
          }
          $builderText = $builderText.Replace("EXP3A", "EXP3B")
          $builderText = $builderText.Replace("exp3a", "exp3b")
          $builderText = $builderText.Replace("26073035", "26073030")
          $builderText = $builderText.Replace(
            "MinimumEfficiencyRatio        = 0.35;",
            "MinimumEfficiencyRatio        = 0.30;"
          )
          if ($builderText -match 'MinimumEfficiencyRatio\s*=\s*0\.35;') {
            throw "EXP3B builder still contains the stale ER 0.35 threshold"
          }
          if ($builderText -match '\$') {
            throw "EXP3B builder contains an unexpected dollar-sign token"
          }
          Set-Content -Path $builderB -Value $builderText -Encoding UTF8

          $runnerText = Get-Content $runnerB -Raw
          $runnerText = $runnerText.Replace("EXP3A", "EXP3B")
          $runnerText = $runnerText.Replace("exp3a", "exp3b")
          $runnerText = $runnerText.Replace("er20_035", "er20_030")
          $runnerText = $runnerText.Replace("ER(20) >= 0.35", "ER(20) >= 0.30")
          Set-Content -Path $runnerB -Value $runnerText -Encoding UTF8

          foreach ($prepared in @($builderB,$runnerB)) {
            if (-not (Test-Path $prepared -PathType Leaf)) { throw "Prepared EXP3B file missing: $prepared" }
          }
          Select-String -Path $builderB -Pattern "MinimumEfficiencyRatio.*0.30|26073030|EXP3B"
          Select-String -Path $runnerB -Pattern "mt5-exp3b|er20_030|ER\(20\).*0.30|build_confirmed_breakout_exp3b_candidate"

      - name: Run locked EXP3B Stage 1 and Stage 2 screen
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          & "$PWD/mt5/run_exp3b_validation.ps1" `
            -MetaTraderRoot $env:MT5_ROOT `
            -RepoRoot $PWD `
            -CompiledCleanExp1Source $env:EXP1_COMPILED_CLEAN_SOURCE `
            -Deposit ([double]"${{ inputs.deposit }}") `
            -Leverage "1:${{ inputs.leverage }}"

      - name: Upload EXP3B Run 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-exp3b-run1-${{ github.run_id }}
          path: artifacts/mt5-exp3b/**
          if-no-files-found: warn
          retention-days: 30
