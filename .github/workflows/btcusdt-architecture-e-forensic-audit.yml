name: BTCUSDT Architecture E Forensic Audit

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/btcusdt-architecture-e-forensic-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/btcusdt-architecture-e-forensic-audit
          fetch-depth: 0
      - name: Validate frozen inputs and audit code
        run: |
          test "$(git rev-parse 1702a3b14f3f9df93715e18fb335d54d9b2eac7c)" = "1702a3b14f3f9df93715e18fb335d54d9b2eac7c"
          test "$(git rev-parse f974d17f9f69d3bd26f869612d4eb7cdaa4b2221)" = "f974d17f9f69d3bd26f869612d4eb7cdaa4b2221"
          test "$(git hash-object docs/BTCUSDT_ARCH_E_FROZEN_BASELINE_SPEC.md)" = "9e5c180a73f74e1e8bb04352f80b5c9d7d1bc2a8"
          test "$(git hash-object research/backtest_btcusdt_arch_e.py)" = "4f58ed4a1e05fd817b9d645878ea731b0c2da552"
          python -m py_compile research/audit_btcusdt_arch_e.py
      - name: Run independent forensic audit
        env:
          AUDIT_OUT: artifacts/btcusdt-arch-e-forensic-audit
          BTC_CACHE: artifacts/btcusdt-arch-e-forensic-audit/data
        run: python research/audit_btcusdt_arch_e.py
      - name: Show forensic summary
        run: cat artifacts/btcusdt-arch-e-forensic-audit/audit_summary.csv
      - name: Upload forensic artifact
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-architecture-e-forensic-audit-${{ github.run_id }}
          path: |
            artifacts/btcusdt-arch-e-forensic-audit/audit_results.json
            artifacts/btcusdt-arch-e-forensic-audit/audit_summary.csv
            artifacts/btcusdt-arch-e-forensic-audit/data_hash_manifest.csv
            artifacts/btcusdt-arch-e-forensic-audit/zero_duration_trades.csv
          if-no-files-found: error
          retention-days: 30
