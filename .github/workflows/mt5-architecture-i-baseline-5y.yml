name: MT5 Architecture I Baseline 5Y

on:
  workflow_dispatch:
    inputs:
      target_ref:
        required: true
        default: "research/architecture-i-channel-trend"
      deposit:
        required: true
        default: "10000"
      leverage:
        required: true
        default: "100"
  push:
    paths:
      - ".github/workflows/mt5-architecture-i-baseline-5y.yml"

permissions:
  contents: read

env:
  MT5_ROOT: "C:\\Program Files\\MetaTrader 5"

jobs:
  baseline:
    name: Run frozen Architecture I baseline matrix
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 600
    steps:
      - name: Checkout exact Architecture I ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'research/architecture-i-channel-trend' }}
          fetch-depth: 0

      - name: Validate frozen inputs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $required=@(
            "$env:MT5_ROOT\terminal64.exe",
            "$env:MT5_ROOT\metaeditor64.exe",
            "$PWD\mt5\run_architecture_i_baseline_5y.ps1",
            "$PWD\mt5\PeakFX_EURUSD_ARCH_I_CHANNEL_TREND.mq5",
            "$PWD\docs\ARCHITECTURE_I_FROZEN_BASELINE_SPEC.md",
            "$PWD\scripts\verify_architecture_i_artifact.py"
          )
          foreach($p in $required){if(-not(Test-Path $p)){throw "Required path missing: $p"}}
          python -m py_compile "$PWD\scripts\verify_architecture_i_artifact.py"
          if($LASTEXITCODE-ne0){throw 'Verifier syntax validation failed'}

      - name: Run Architecture I frozen baseline matrix
        shell: powershell
        run: |
          & "$PWD\mt5\run_architecture_i_baseline_5y.ps1" `
            -MetaTraderRoot $env:MT5_ROOT `
            -RepoRoot $PWD `
            -Deposit ([double]"${{ github.event_name == 'workflow_dispatch' && inputs.deposit || '10000' }}") `
            -Leverage "1:${{ github.event_name == 'workflow_dispatch' && inputs.leverage || '100' }}"

      - name: Independently verify complete artifact
        shell: powershell
        run: |
          python "$PWD\scripts\verify_architecture_i_artifact.py" `
            "$PWD\artifacts\architecture-i-baseline-5y" `
            --output "$PWD\artifacts\architecture-i-baseline-5y\independent_verification.json"
          if($LASTEXITCODE-ne0){throw 'Independent Architecture I verification failed'}

      - name: Upload Architecture I baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-architecture-i-baseline-5y-${{ github.run_id }}
          path: artifacts/architecture-i-baseline-5y/**
          if-no-files-found: error
          retention-days: 30
