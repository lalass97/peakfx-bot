name: MT5 EXP2 Run 1

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Exact branch or commit to validate
        required: true
        default: "research/confirmed-breakout-exp2-mt5-candidate"
      fixed_spread_points:
        description: Recorded spread stress floor in points (not silently assumed enforced)
        required: true
        default: "15"
      deposit:
        description: Test deposit
        required: true
        default: "10000"
      leverage:
        description: Leverage, e.g. 100
        required: true
        default: "100"

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  run1:
    name: Compile, smoke, and 12-month screen
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180

    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0

      - name: Enable runner script execution
        shell: cmd
        run: |
          reg.exe ADD "HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" /v ExecutionPolicy /t REG_SZ /d RemoteSigned /f
          reg.exe QUERY "HKCU\Software\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell" /v ExecutionPolicy

      - name: Install Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required runner environment
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:MT5_ROOT)) {
            throw "Runner must define MT5_ROOT."
          }
          if (-not (Test-Path $env:MT5_ROOT -PathType Container)) {
            throw "MT5_ROOT must be an existing directory: $env:MT5_ROOT"
          }
          foreach ($exe in @("metaeditor64.exe", "terminal64.exe")) {
            $candidate = Join-Path $env:MT5_ROOT $exe
            if (-not (Test-Path $candidate -PathType Leaf)) { throw "Missing $candidate" }
          }
          python --version

      - name: Resolve exact verified EXP1 source
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $explicit = ""
          if (-not [string]::IsNullOrWhiteSpace($env:EXP1_COMPILED_CLEAN_SOURCE)) {
            $explicit = $env:EXP1_COMPILED_CLEAN_SOURCE
          }
          python "$PWD/research/resolve_exp1_source.py" `
            --explicit $explicit `
            --github-env $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { throw "Unable to resolve a verified EXP1 source." }

      - name: Run locked Stage 1 and Stage 2 pipeline
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:RESOLVED_EXP1_SOURCE)) {
            throw "RESOLVED_EXP1_SOURCE was not set by the resolver step."
          }
          $stamp = Get-Date -Format "yyyyMMdd_HHmmss"
          $output = Join-Path $PWD "artifacts/runs/run_$stamp"
          $log = Join-Path $PWD "artifacts/logs/mt5_execution_$stamp.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $log) | Out-Null

          & "$PWD/scripts/Run-MT5Pipeline.ps1" `
            -MetaTraderRoot $env:MT5_ROOT `
            -RepoRoot $PWD `
            -SourceEA $env:RESOLVED_EXP1_SOURCE `
            -ConfigPath "$PWD/research/gatekeeper_rules.json" `
            -Symbol "EURUSD" `
            -Period "H1" `
            -Deposit ([double]"${{ inputs.deposit }}") `
            -Leverage ([int]"${{ inputs.leverage }}") `
            -FixedSpreadPoints ([int]"${{ inputs.fixed_spread_points }}") `
            -OutputDir $output `
            -LogPath $log

      - name: Upload MT5 Run 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-exp2-run1-${{ github.run_id }}
          path: |
            artifacts/runs/**
            artifacts/logs/**
            artifacts/mt5-exp2/**
          if-no-files-found: warn
          retention-days: 30
